<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./slides/">
  <title>01_生成AI仕事術</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      background: #f4f6f8;
      color: #1b2432;
    }

    .panel {
      width: min(680px, calc(100% - 48px));
      padding: 40px;
      border: 1px solid #d4dce7;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(27, 36, 50, 0.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #095f9e;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }

    p {
      margin: 18px 0 0;
      line-height: 1.9;
      color: #5d6777;
    }

    a {
      display: inline-flex;
      align-items: center;
      margin-top: 24px;
      padding: 12px 18px;
      border: 1px solid #0d84d8;
      border-radius: 8px;
      color: #0d84d8;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">AI-Fukuoka</p>
    <h1>01_生成AI仕事術</h1>
    <p>スライド本体へ移動します。自動で移動しない場合は、下のリンクから開いてください。</p>
    <a href="./slides/">スライドを開く</a>
  </main>
</body>
</html>
